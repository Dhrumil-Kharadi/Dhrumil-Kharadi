<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Dhrumil Kharadi — DevOps Engineer and Full-Stack Developer">
  <title>Dhrumil Kharadi — DevOps Engineer &amp; Full-Stack Developer</title>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .display { font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .serif { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
      .rise { opacity: 0; animation: rise 1.2s cubic-bezier(.16,1,.3,1) forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .7s } .d4 { animation-delay: 1s }
      @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      .float { animation: float 7s ease-in-out infinite; transform-origin: 905px 196px; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-10px) rotate(5deg) } }
      .dot { animation: step 6s infinite; }
      .s1 { animation-delay: 0s } .s2 { animation-delay: .75s } .s3 { animation-delay: 1.5s } .s4 { animation-delay: 2.25s } .s5 { animation-delay: 3s }
      @keyframes step { 0% { fill: transparent } 8%, 85% { fill: #f4f3ef } 100% { fill: transparent } }
      .wire { stroke-dasharray: 34; stroke-dashoffset: 34; animation: wire 6s infinite; }
      .w2 { animation-delay: .75s } .w3 { animation-delay: 1.5s } .w4 { animation-delay: 2.25s }
      @keyframes wire { 0% { stroke-dashoffset: 34 } 12%, 85% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 34 } }
      .live { animation: live 6s infinite; animation-delay: 3s; opacity: .35 }
      @keyframes live { 0% { opacity: .35 } 6%, 70% { opacity: 1 } 100% { opacity: .35 } }
    </style>

    <!-- ink panel -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>

    <!-- blueprint grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx=".72" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="420" fill="url(#gridFade)"/></mask>

    <!-- white smoke: drifting fractal noise turned into soft alpha -->
    <filter id="smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.011" numOctaves="4" seed="11">
        <animate attributeName="baseFrequency" dur="28s" repeatCount="indefinite"
                 values="0.0045 0.011;0.0058 0.0145;0.0045 0.011"/>
      </feTurbulence>
      <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.96  0 0 0 0 0.95  0 0 0 2.4 -1.05"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="plume" cx=".75" cy=".6" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="plumeMask"><rect width="1200" height="420" fill="url(#plume)"/></mask>

    <!-- soft rim light behind the matter -->
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- anomalous matter: smoothly displaced sphere with a lit stone-grain surface -->
    <radialGradient id="clay" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset=".38" stop-color="#d6d5d0"/>
      <stop offset=".72" stop-color="#7a7975"/>
      <stop offset="1" stop-color="#262624"/>
    </radialGradient>
    <filter id="matter" x="-35%" y="-35%" width="170%" height="170%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0062" numOctaves="1" seed="4" result="warp">
        <animate attributeName="baseFrequency" dur="16s" repeatCount="indefinite"
                 values="0.0062;0.0078;0.0062"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="46" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="9" result="grain"/>
      <feDiffuseLighting in="grain" surfaceScale="1.4" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="225" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="shape" operator="in" result="tex"/>
      <feBlend in="shape" in2="tex" mode="multiply"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x=".5" y=".5" width="1199" height="419" rx="24" fill="url(#ink)" stroke="url(#rim)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <g mask="url(#plumeMask)" opacity=".42">
    <rect width="1200" height="420" filter="url(#smoke)"/>
  </g>

  <!-- 3D matter -->
  <circle cx="905" cy="196" r="190" fill="url(#halo)"/>
  <g class="float">
    <circle cx="905" cy="196" r="112" fill="url(#clay)" filter="url(#matter)"/>
  </g>

  <!-- meta -->
  <g class="mono rise d1" font-size="12" letter-spacing="3" fill="#f4f3ef" fill-opacity=".5">
    <text x="64" y="64">DEVOPS ENGINEER · FULL-STACK DEVELOPER</text>
    <text x="1136" y="64" text-anchor="end">AHMEDABAD, IN</text>
  </g>

  <!-- name -->
  <text class="display rise d2" x="60" y="196" font-size="104" letter-spacing="-5" fill="#f4f3ef">DHRUMIL</text>
  <text class="serif rise d3" x="118" y="282" font-size="92" letter-spacing="-1" fill="#f4f3ef">Kharadi</text>

  <!-- pipeline: commit → build → test → deploy → live -->
  <g transform="translate(64 350)"><g class="rise d4">
    <rect x="0" y="-22" width="520" height="44" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <g fill="none" stroke="#f4f3ef" stroke-width="1.3">
      <circle cx="26" cy="0" r="6"/><circle class="dot s1" cx="26" cy="0" r="6" stroke="none"/>
      <circle cx="128" cy="0" r="6"/><circle class="dot s2" cx="128" cy="0" r="6" stroke="none"/>
      <circle cx="218" cy="0" r="6"/><circle class="dot s3" cx="218" cy="0" r="6" stroke="none"/>
      <circle cx="306" cy="0" r="6"/><circle class="dot s4" cx="306" cy="0" r="6" stroke="none"/>
      <circle cx="414" cy="0" r="6"/><circle class="dot s5" cx="414" cy="0" r="6" stroke="none"/>
      <path class="wire" d="M90 0h34"/>
      <path class="wire w2" d="M180 0h34"/>
      <path class="wire w3" d="M268 0h34"/>
      <path class="wire w4" d="M376 0h34"/>
    </g>
    <g class="mono" font-size="11" letter-spacing="1.6" fill="#f4f3ef">
      <text x="38" y="4">COMMIT</text>
      <text x="140" y="4">BUILD</text>
      <text x="230" y="4">TEST</text>
      <text x="318" y="4">DEPLOY</text>
      <text class="live" x="426" y="4">LIVE</text>
    </g>
  </g></g>

  <!-- signature line: clear of the matter -->
  <text class="mono rise d4" x="1136" y="384" text-anchor="end" font-size="12" letter-spacing="2" fill="#f4f3ef" fill-opacity=".45">SHIPS IT. KEEPS IT UP.</text>
</svg>
