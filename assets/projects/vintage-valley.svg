<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Vintage Valley — Hotel booking platform, end to end">
  <title>Vintage Valley — Hotel booking platform, end to end</title>
  <defs>
    <linearGradient id="vintage-valley-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#efeee9"/>
    </linearGradient>
    <linearGradient id="vintage-valley-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#0b0b0b" stop-opacity=".1"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="vintage-valley-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <path d="M0 0V12" stroke="#0b0b0b" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="vintage-valley-orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fdfcf9"/><stop offset=".55" stop-color="#d9d8d3"/><stop offset="1" stop-color="#77766f"/>
    </radialGradient>
    <filter id="vintage-valley-warp" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="28" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .arrow { transition: transform .3s; }
      .orb { animation: spin 18s linear infinite; transform-origin: 520px 78px; }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>
  
  <rect x=".5" y=".5" width="599" height="299" rx="20" fill="url(#vintage-valley-paper)" stroke="url(#vintage-valley-rim)"/>
  <rect x="1" y="1" width="598" height="298" rx="20" fill="url(#vintage-valley-hatch)"/>
  <g class="orb"><circle cx="520" cy="78" r="38" fill="url(#vintage-valley-orb)" filter="url(#vintage-valley-warp)"/></g>

  <text x="32" y="48" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="12" letter-spacing="2" fill="#0b0b0b" fill-opacity=".5">04</text>
  <text x="70" y="48" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="11" letter-spacing="2" fill="#0b0b0b" fill-opacity=".5">FREELANCE · LIVE</text>

  <text x="30" y="128" font-family='"Arial Black", "Helvetica Neue", Arial, sans-serif' font-weight="900" font-size="44" letter-spacing="-2" fill="#0b0b0b">Vintage Valley</text>
  <text x="32" y="166" font-family='Georgia, "Times New Roman", serif' font-style="italic" font-size="21" fill="#0b0b0b" fill-opacity=".62">Hotel booking platform, end to end</text>

  <g transform="translate(32 196)">
      <rect width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.75" stroke="#0b0b0b" stroke-opacity="0.14"/>
      <text x="44" y="16.96" text-anchor="middle" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="11" letter-spacing="1.4" fill="#0b0b0b">RAZORPAY</text>
    </g>
    <g transform="translate(128 196)">
      <rect width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.75" stroke="#0b0b0b" stroke-opacity="0.14"/>
      <text x="44" y="16.96" text-anchor="middle" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="11" letter-spacing="1.4" fill="#0b0b0b">EZEE API</text>
    </g>
    <g transform="translate(224 196)">
      <rect width="48" height="26" rx="13" fill="#ffffff" fill-opacity="0.75" stroke="#0b0b0b" stroke-opacity="0.14"/>
      <text x="24" y="16.96" text-anchor="middle" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="11" letter-spacing="1.4" fill="#0b0b0b">JWT</text>
    </g>

  <line x1="32" y1="252" x2="568" y2="252" stroke="#0b0b0b" stroke-opacity=".1"/>
  <text x="32" y="278" font-family='"JetBrains Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace' font-size="12" letter-spacing="1" fill="#0b0b0b" fill-opacity=".7">vintagevalleyresort.com</text>
  <g transform="translate(542 262)">
    <circle cx="13" cy="13" r="13" fill="#0b0b0b"/>
    <path d="M9 17 17 9M11 9h6v6" fill="none" stroke="#f4f3ef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
