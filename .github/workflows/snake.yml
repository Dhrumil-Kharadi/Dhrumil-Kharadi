# Redraws the contribution "snake" every 12 hours and publishes it to the
# `output` branch, which the profile README links to.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0b0b0b&color_dots=#ebebe6,#c9c9c4,#9a9a95,#5f5f5b,#0b0b0b
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4f3ef&color_dots=#161b22,#3a3a3a,#6b6b6b,#a6a6a6,#f4f3ef

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
